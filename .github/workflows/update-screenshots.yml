name: Update component screenshots

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  update-screenshots:
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/update-screenshots' &&
        (github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'))
    concurrency:
      group: update-screenshots@${{ github.event.issue.number || github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check commenter permission
        if: github.event_name == 'issue_comment'
        id: authorization
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const username = context.payload.comment.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed(`@${username} needs write access to run this command.`);
            }

      - name: Get PR head ref
        if: github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headRepo = pr.head.repo?.full_name;
            const baseRepo = pr.base.repo.full_name;
            if (!headRepo || headRepo !== baseRepo) {
              core.setFailed(`Fork PRs are not supported (head: ${headRepo}, base: ${baseRepo})`);
              return;
            }
            core.setOutput('ref', pr.head.ref);

      - name: Checkout selected branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.pr.outputs.ref || github.ref_name }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install browsers
        run: pnpm run --dir packages/tree-widget install-browsers

      - name: Build component tests
        run: pnpm exec lage build --to @itwin/tree-widget-react

      - name: Update component screenshots
        env:
          CI: true
        run: pnpm run --dir packages/tree-widget test:components:update

      - name: Commit updated screenshots
        id: commit
        shell: bash
        run: |
          git add -- packages/tree-widget/src/test/components
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No screenshot updates were needed."
            exit 0
          fi
          unexpected_files=$(git diff --cached --name-only | grep -vE '\.png$' || true)
          if [[ -n "$unexpected_files" ]]; then
            echo "Unexpected non-screenshot changes detected:"
            echo "$unexpected_files"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update component screenshots"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push updated screenshots
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.pr.outputs.ref || github.ref_name }}
        run: |
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:$TARGET_REF"

      - name: Summary
        env:
          TARGET_REF: ${{ steps.pr.outputs.ref || github.ref_name }}
        run: |
          if [[ "${{ steps.commit.outputs.changed }}" == "true" ]]; then
            printf 'Updated component screenshots were pushed to `%s`.\n' "$TARGET_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No component screenshots needed updating." >> "$GITHUB_STEP_SUMMARY"
          fi
