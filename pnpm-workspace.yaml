packages:
  - packages/*
  - apps/test-viewer
  - apps/learning-snippets
  - apps/performance-tests

packageConfigs:
  "@itwin/property-grid-react":
    overrides:
      "@playwright/test": 1.61.1
      playwright: 1.61.1
  "@itwin/tree-widget-react":
    overrides:
      "@playwright/test": 1.61.1
      playwright: 1.61.1
  "test-viewer":
    overrides:
      "@itwin/itwinui-react@^2": "2.12.26"
      "@itwin/itwinui-react@^3": "3.22.0"

allowBuilds:
  '@bentley/imodeljs-native': true
  '@itwin/certa': true
  '@itwin/oidc-signin-tool': true
  '@parcel/watcher': false
  esbuild: true
  puppeteer: true
  typemoq: true

syncInjectedDepsAfterScripts:
  - "build"

resolutionMode: lowest-direct

sideEffectsCache: false

sharedWorkspaceLockfile: false
injectWorkspacePackages: true

packageManagerStrict: false

minimumReleaseAgeExclude:
  - '@itwin/presentation-core-interop@2.0.0'
  - '@itwin/presentation-hierarchies-react@2.0.0'
  - '@itwin/presentation-hierarchies@2.0.0'
  - '@itwin/presentation-shared@2.0.0'
  - '@itwin/unified-selection@2.0.0'
