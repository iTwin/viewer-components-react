# Temporary diagnostic workflow - verifies the NPMJS_PUBLISH_ITWIN token
# identity and per-package publish access. Remove once publishing is fixed.
name: Check npm token access

on: pull_request

jobs:
  check:
    if: github.repository_owner == 'iTwin'
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Check token identity
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}

      - name: Check package access
        run: |
          echo "--- npm access list packages imodeljs ---"
          npm access list packages imodeljs > packages.txt || true
          echo "listed $(wc -l < packages.txt) packages"
          grep -E "geo-tools-react|map-layers|measure-tools-react|property-grid-react|quantity-formatting-react|tree-widget-react" packages.txt || echo "none of the vcr packages are listed"
          echo "--- npm access get status ---"
          for p in geo-tools-react map-layers measure-tools-react property-grid-react quantity-formatting-react tree-widget-react; do
            npm access get status "@itwin/$p" || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
