name: PR Tree-Widget performance benchmark

on:
  pull_request:
    branches:
      - master
    paths:
      - apps/performance-tests/**
      - packages/tree-widget/**
      - .github/workflows/benchmark-pr-tree-widget.yml
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  benchmark:
    uses: ./.github/workflows/benchmark-tree-widget-shared.yml
    with:
      display-name: 'Tree-Widget: Benchmark performance'
      benchmark-name: 'Tree-Widget benchmark'
      mode: 'pr'
      gh-pages-branch: gh-pages
