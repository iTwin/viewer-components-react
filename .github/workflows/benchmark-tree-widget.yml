name: Tree-Widget performance benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - apps/performance-tests/**
      - packages/tree-widget/**

jobs:
  benchmark:
    uses: ./.github/workflows/benchmark-tree-widget-shared.yml
    with:
      display-name: 'Tree-Widget: Benchmark performance'
      benchmark-name: 'Tree-Widget benchmark'
      mode: 'push'
      gh-pages-branch: gh-pages
